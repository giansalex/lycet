components:
  schemas:
    OpenApiDefinition: {  }
    Address:
      properties:
        ubigueo:
          description: "Definición global de la especificación OpenAPI (info, servers, seguridad, tags)\ny de todos los esquemas de datos base (modelos y respuestas).\n\nLos modelos viven en el paquete greenter/core (carpeta vendor), que no se\nanota directamente. Por eso los @OA\\Schema se declaran aquí, reflejando el\nmapeo del serializer (config/serializer/*.yml).\n\nEste archivo NO contiene endpoints. Cada endpoint se anota en su controlador."
          type: string
        codigoPais:
          type: string
        departamento:
          type: string
        provincia:
          type: string
        distrito:
          type: string
        urbanizacion:
          type: string
        direccion:
          type: string
        codLocal:
          type: string
      type: object
    Client:
      properties:
        tipoDoc:
          type: string
        numDoc:
          type: string
        rznSocial:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
        telephone:
          type: string
      type: object
    Company:
      properties:
        ruc:
          type: string
        razonSocial:
          type: string
        nombreComercial:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        email:
          type: string
        telephone:
          type: string
      type: object
    Charge:
      properties:
        codTipo:
          type: string
        factor:
          type: number
          format: float
        monto:
          type: number
          format: float
        montoBase:
          type: number
          format: float
      type: object
    DetailAttribute:
      properties:
        code:
          type: string
        name:
          type: string
        value:
          type: string
        fecInicio:
          type: string
          format: date-time
        fecFin:
          type: string
          format: date-time
        duracion:
          type: integer
      type: object
    SaleDetail:
      properties:
        unidad:
          type: string
        cantidad:
          type: number
          format: float
